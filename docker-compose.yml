# =============================================================================
#  Qubu Resort — production-ish local stack
#
#  Build & start : docker compose --env-file .env.production up -d --build
#  Logs          : docker compose logs -f web
#  Stop          : docker compose down
#
#  NEXT_PUBLIC_* is baked into the bundle by `next build`, so it is passed as a
#  build arg here — changing it later requires rebuilding the image.
# =============================================================================
name: qubu-resort

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    image: ${IMAGE_NAME:-qubu-resort-company-profile}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Uncomment to cap resource usage on a shared VPS:
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1.0"
    #       memory: 512M
